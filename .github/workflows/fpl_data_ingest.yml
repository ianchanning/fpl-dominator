name: Automated Gameweek Data Ingest (RFC-012)

on:
  schedule:
    # Trigger on a Wednesday
    - cron: '0 12 * * 3'
  workflow_dispatch:
    inputs:
      gameweek:
        description: 'Gameweek Vault to Populate (e.g. gw8, leave empty for latest/auto)'
        required: false
        default: ''
      auto_finalize:
        description: 'Execute bamf finalize after harvest'
        type: boolean
        default: true

jobs:
  harvest:
    name: Harvest Gameweek Data
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ianchanning/fpl-dominator-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark Workspace as Git Safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Link Working Copy
        run: uv pip install --no-deps -e .

      - name: Execute Headless Ingestion via Playwright
        env:
          FPL_LOGIN: ${{ secrets.FPL_LOGIN }}
          FPL_PASS: ${{ secrets.FPL_PASS }}
          FFS_LOGIN: ${{ secrets.FFS_LOGIN }}
          FFS_PASS: ${{ secrets.FFS_PASS }}
        run: |
          GW_ARG="${{ inputs.gameweek }}"
          if [ -z "$GW_ARG" ]; then
            bamf fetch
          else
            bamf fetch "$GW_ARG"
          fi

      - name: Execute Finalize Pipeline & Solver
        if: ${{ github.event_name == 'schedule' || inputs.auto_finalize }}
        run: |
          GW_ARG="${{ inputs.gameweek }}"
          if [ -z "$GW_ARG" ]; then
            python -c "from fpl_dominator.bamf import get_latest_gw; import subprocess; gw = get_latest_gw(); subprocess.run(['bamf', 'finalize', gw], check=True)"
          else
            bamf finalize "$GW_ARG"
          fi

      - name: Commit & Push Harvested Vault
        run: |
          git config user.name "BAMF Autonomous Harvester"
          git config user.email "bot@bamf-dominator.internal"
          git add gw*/
          if git diff --staged --quiet; then
            echo "No data changes detected. Nothing to commit."
          else
            GW_NAME="${{ inputs.gameweek || 'latest gameweek' }}"
            git commit -m "chore(data): automated headless ingest for $GW_NAME [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

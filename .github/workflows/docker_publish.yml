name: Build & Publish Harvester Container Image

on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - '.github/workflows/docker_publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-runner

jobs:
  build-and-push:
    name: Build & Publish GHCR Runner Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract Playwright Version from Lockfile
        id: pw
        run: |
          PW_VERSION=$(grep -A1 '^name = "playwright"$' uv.lock | grep '^version' | sed 's/version = "\(.*\)"/\1/')
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PLAYWRIGHT_VERSION=${{ steps.pw.outputs.version }}
          # Buildx >= 0.13 / docker 25+ defaults push to bundle a SLSA provenance
          # attestation sibling manifest (platform: unknown/unknown) inside the
          # OCI index, which GHCR's package page renders as a phantom second
          # "architecture". We push a single-platform amd64 image, so attestations
          # add no value here — disable them for a clean single-manifest tag.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

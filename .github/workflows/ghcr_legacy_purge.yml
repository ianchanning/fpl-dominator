name: GHCR Legacy Tag Purge (One-Off)

# Throwaway maintenance workflow: deletes every container package version
# of fpl-dominator-runner that does NOT hold the `latest` tag. Safe to run
# any time — the latest version is always protected by the filter.
# Delete this workflow file after its last successful use.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  purge-legacy-versions:
    name: Purge Non-Latest Package Versions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PKG_NAME: fpl-dominator-runner
      PKG_OWNER: ianchanning
    steps:
      - name: List & Delete All Non-Latest Versions
        run: |
          set -euo pipefail
          BASE="https://api.github.com/user/packages/container/$PKG_NAME/versions"
          VERSIONS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$BASE?per_page=100")
          IDS=$(echo "$VERSIONS" | jq -r \
            '.[] | select(((.metadata.container.tags // []) | index("latest") | not)) | "\(.id) \(.name)"')
          COUNT=$(echo "$IDS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No non-latest versions found — nothing to purge."
            exit 0
          fi
          echo "Purging $COUNT legacy version(s):"
          echo "$IDS"
          for LINE in $IDS; do
            ID=$(echo "$LINE" | cut -d' ' -f1)
            NAME=$(echo "$LINE" | cut -d' ' -f2)
            CODE=$(curl -s -o /tmp/purge_resp.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$BASE/$ID")
            echo "DELETE $NAME (id=$ID) -> HTTP $CODE :: $(cat /tmp/purge_resp.json)"
            # 204 = deleted; 404 = already gone (idempotent re-runs)
            if [ "$CODE" != "204" ] && [ "$CODE" != "404" ]; then
              echo "::error::Failed to delete version $ID (HTTP $CODE)"
              exit 1
            fi
          done
          echo "Purge complete."
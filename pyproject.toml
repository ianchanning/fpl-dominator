[project]
name = "fpl-dominator"
version = "3.0.0"
description = "The Chimera Command Deck for FPL Domination"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pandas",
    "pyomo",
    "PyYAML",
    "beautifulsoup4",
    "lxml",
    "playwright>=1.64.0",
    "python-dotenv>=1.2.4",
]

# THIS IS THE SACRED INCANTATION
[project.scripts]
bamf = "fpl_dominator.bamf:bamf"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["archive", ".agents", "wiki"]

# Pyomo uses dynamic __setattr__ for model components (Set, Var, Constraint, Objective).
# Its type stubs are fundamentally incomplete — Component lacks __getitem__ and __iter__.
# See: wiki/concepts/Pyomo-Type-Safety-and-Linopy.md
[tool.ty.analysis]
replace-imports-with-any = ["pyomo.**"]

[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
redundant-cast = "ignore"

[tool.ruff]
target-version = "py310"
exclude = [
    "archive",
    ".agents",
    "wiki",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
